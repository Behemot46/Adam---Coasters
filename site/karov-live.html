<title>קרוב לייב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
/* ES5 only, so it still runs where the main script cannot (old engine, parse error) */
(function () {
  function show(msg) {
    var b = document.getElementById('fatal');
    if (!b || !msg || msg === 'Script error.') return;
    b.textContent = '';
    var t = document.createElement('b'), m = document.createElement('span');
    t.appendChild(document.createTextNode('משהו נשבר בדף.'));
    m.appendChild(document.createTextNode(msg + ' · רעננו, ואם זה חוזר, שלחו צילום מסך.'));
    b.appendChild(t); b.appendChild(m); b.hidden = false;
  }
  window.addEventListener('error', function (e) { show((e.message || 'שגיאה') + (e.lineno ? ' (שורה ' + e.lineno + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show(String((r && r.message) || r || 'שגיאה')); });
  setTimeout(function () { var f = document.getElementById('fatal'); if (!window.__karovBooted && f && f.hidden) show('הקוד הראשי של ההדגמה לא הופעל (דפדפן ישן, או חסימת סקריפטים)'); }, 3000);
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: one app, four views on hash anchors. Demo = diner phone beside the staff board; board = floor map + thermal tickets; report = filter row, stat tiles, charts, pilot gates; setup = form beside a live preview, then QR labels. #t7 / #q7 open a bare diner page. RTL. */
:root{
  --bg:#F1F4F2;        /* laminate tabletop */
  --surface:#FFFFFF;
  --ink:#13201A;
  --muted:#55645D;
  --line:#D0D9D4;
  --grid:#E3E9E6;
  --teal:#0E5A47;      /* Karov bottle green */
  --teal-ink:#FFFFFF;
  --teal-soft:#DDEBE4;
  --yolk:#F5C542;      /* the "new" signal */
  --yolk-ink:#2B2100;
  --yolk-soft:#FBEFC9;
  --alert:#BF3F2B;
  --alert-ink:#FFFFFF;
  --paper:#FFFEF8;     /* thermal paper stays paper in both themes */
  --paper-ink:#1B1E1C;
  --paper-muted:#686D67;
  --paper-line:#E2E0D5;
  --paper-accent:#0E5A47;
  --paper-red:#BF3F2B;
  --paper-yolk:#F8D35E;
  --steel-hi:#D7DEDA;  /* the bar rail */
  --steel-lo:#8B9792;
  --chart:#1F7A60;
  --chart-hi:#0E5A47;
  --st-good:#0CA30C;
  --st-warn:#E39A00;
  --plate:#FFFFFF;     /* logo plate, same in both themes */
  --bezel:#0E1512;     /* phone body, same in both themes */
  --shadow:rgb(19 32 26 / .16);
  --scrim:rgb(19 32 26 / .40);
  --lift:0%;           /* how much a venue color is lightened on dark grounds */
  --display:"Karantina","Secular One","Arial Hebrew",Arial,sans-serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#151E1A; --ink:#E7EFEB; --muted:#9AABA3; --line:#28352F; --grid:#1F2A25;
    --teal:#4DB492; --teal-ink:#07130E; --teal-soft:#16302A; --yolk:#EDC14A; --yolk-ink:#271E00; --yolk-soft:#3A3320;
    --alert:#EC7F6A; --alert-ink:#240A05; --chart:#4DB492; --chart-hi:#86D4B9; --steel-hi:#66736D; --steel-lo:#2C3632;
    --shadow:rgb(0 0 0 / .5); --scrim:rgb(0 0 0 / .6); --lift:42%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151E1A; --ink:#E7EFEB; --muted:#9AABA3; --line:#28352F; --grid:#1F2A25;
  --teal:#4DB492; --teal-ink:#07130E; --teal-soft:#16302A; --yolk:#EDC14A; --yolk-ink:#271E00; --yolk-soft:#3A3320;
  --alert:#EC7F6A; --alert-ink:#240A05; --chart:#4DB492; --chart-hi:#86D4B9; --steel-hi:#66736D; --steel-lo:#2C3632;
  --shadow:rgb(0 0 0 / .5); --scrim:rgb(0 0 0 / .6); --lift:42%; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{direction:rtl;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);font-weight:700;line-height:1;text-wrap:balance}
.tape{background:var(--yolk);color:var(--yolk-ink);padding-inline:.12em;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
a{color:var(--teal)}

/* app chrome */
.app{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
.bar{display:flex;align-items:center;gap:12px 18px;padding-block:14px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1}
.mark svg{width:26px;height:26px;color:var(--teal)}
.mark small{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted);padding:2px 8px;border:1px solid var(--line);border-radius:999px}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.92rem;padding:6px 14px;border-radius:999px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--teal);color:var(--teal-ink)}
.conn{margin-inline-start:auto;display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.conn.live i{background:var(--st-good);animation:blink 2s ease-in-out infinite}
.conn.readonly i,.conn.local i{background:var(--st-warn)}
.conn.offline i{background:var(--alert)}
@keyframes blink{50%{opacity:.3}}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--yolk-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:.92rem;margin-bottom:16px}
.banner b{flex:none}
.view{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font-size:2.1rem}
.card h3{font-family:var(--body);font-weight:800;font-size:1.02rem;line-height:1.3}
.sub{font-size:.85rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:.95rem;padding:9px 18px;border-radius:12px;border:1.5px solid var(--teal);background:transparent;color:var(--teal);text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--teal);color:var(--teal-ink)}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.btn.danger.solid{background:var(--alert);color:var(--alert-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;inset-inline:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);margin-inline:auto;max-width:440px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;text-align:center;font-weight:600;font-size:.92rem;z-index:50;box-shadow:0 8px 24px var(--shadow)}

/* demo hub */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.intro h1{font-size:clamp(2.3rem,4.2vw,3.3rem);line-height:.98}
.intro p{color:var(--muted);margin-top:6px;max-width:46em}
.qrmini{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-width:300px}
.qrmini .qr{flex:none;border-radius:6px}
.qrmini span{font-size:.85rem;font-weight:600;line-height:1.35}
.hub{display:grid;grid-template-columns:350px minmax(0,1fr);gap:24px;align-items:start}
.phonecol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px;align-items:center}
.seat{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--muted)}
.seat button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;line-height:1}
.seat b{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;color:var(--ink);min-width:2ch;text-align:center}
.handset{background:var(--bezel);border-radius:40px;padding:11px;width:100%;max-width:330px;box-shadow:0 0 0 1px var(--line),0 18px 40px var(--shadow)}
.handset .screen{background:var(--bg);border-radius:30px;overflow:hidden;height:640px;position:relative}
.handset.small{max-width:290px}
.handset.small .screen{height:560px}
.caption{font-size:.8rem;color:var(--muted);text-align:center;max-width:320px}

/* diner page */
.d-shell{position:relative;height:100%}
.d-shell.standalone{min-height:100vh;min-height:100dvh;height:auto;max-width:480px;margin-inline:auto}
.diner{--brand:#0F5C4A;--brand-ink:#FFFFFF;--brand-line:color-mix(in oklab,var(--brand),#FFFFFF var(--lift));height:100%;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.standalone .diner{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}
.diner:lang(ar){font-family:"Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif}
.diner:lang(ru),.diner:lang(en){font-family:"Assistant","Segoe UI",Roboto,Arial,sans-serif}
.d-head{background:var(--brand);color:var(--brand-ink);padding:20px 16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.d-logo{width:52px;height:52px;border-radius:50%;background:var(--brand-ink);color:var(--brand);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.65rem;overflow:hidden;grid-row:span 2}
.d-logo.img{background:var(--plate)}
.d-logo img{width:100%;height:100%;object-fit:contain}
.d-name{font-family:var(--display);font-weight:700;font-size:2.15rem;line-height:1;overflow-wrap:anywhere}
.d-table{font-weight:700;font-size:.92rem;opacity:.92}
.d-langs{grid-column:1/-1;display:flex;gap:6px;margin-top:10px}
.d-lang{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;opacity:.72;min-height:28px}
.d-lang[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink);opacity:1}
.d-body{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
.d-status{display:flex;flex-direction:column;gap:8px}
.d-status:empty{display:none}
.d-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:var(--yolk-soft);border-radius:14px;padding:10px 12px}
.d-card::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--yolk);grid-row:span 2}
.d-card b{font-size:.95rem}
.d-card span{font-size:.85rem;color:var(--muted);grid-column:2}
.d-card .age{grid-row:1/span 2;grid-column:3;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.d-card.s-ack{background:var(--teal-soft)} .d-card.s-ack::before{background:var(--teal)}
.d-card.s-ack span{color:var(--teal);font-weight:700}
.d-card.s-done{background:var(--surface);border:1px solid var(--line)} .d-card.s-done::before{background:var(--st-good)}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:96px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;font-weight:800;font-size:1rem;line-height:1.25;text-align:center;text-decoration:none;padding:10px 8px}
.d-btn svg{width:28px;height:28px;color:var(--brand-line)}
.d-btn.primary{border-color:var(--brand-line)}
.d-btn.issue{border-color:var(--alert)}
.d-btn.issue svg{color:var(--alert)}
.d-btn:active{transform:scale(.97)}
.d-grid>:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;min-height:62px}
.d-fair{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.4}
.d-foot{padding:14px 16px 18px;display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.45rem;color:var(--muted)}
.d-foot button{font-family:var(--body);font-size:.8rem;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;color:var(--teal)}
.d-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.standalone .d-layer{position:fixed;max-width:480px;margin-inline:auto}
.d-scrim{position:absolute;inset:0;background:var(--scrim);pointer-events:auto}
.d-sheet{position:absolute;inset-inline:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -12px 32px var(--shadow);padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.d-sheet h2{font-family:var(--display);font-size:2rem;line-height:1}
.d-layer:not(:lang(he)) .d-sheet h2{font-family:var(--body);font-weight:800;font-size:1.25rem;line-height:1.3}
.d-sheet p{font-size:.85rem;color:var(--muted)}
.d-chips{display:flex;flex-wrap:wrap;gap:8px}
.d-chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:.92rem;font-weight:600}
.d-chip[aria-pressed="true"]{border-color:var(--alert);color:var(--alert);background:var(--surface)}
.d-sheet label{font-size:.85rem;font-weight:700}
.d-sheet textarea{width:100%;min-height:68px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);resize:vertical}
.d-send{border:0;border-radius:14px;padding:12px;font-weight:800;background:var(--alert);color:var(--alert-ink)}
.d-send.calm{background:var(--brand);color:var(--brand-ink)}
.d-x{border:0;background:transparent;color:var(--muted);font-weight:700;padding:6px}
.d-wifi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;background:var(--bg);border-radius:12px;padding:12px;font-size:.95rem}
.d-wifi dt{color:var(--muted)} .d-wifi dd{margin:0;font-family:var(--mono);font-weight:700;overflow-wrap:anywhere;direction:ltr;text-align:end}
.d-toast{position:absolute;inset-inline:14px;bottom:14px;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 12px;text-align:center;font-size:.9rem;font-weight:600;line-height:1.35;pointer-events:auto}
.d-skel{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.9rem;padding:24px;text-align:center}

/* board */
.board{display:flex;flex-direction:column;gap:14px;min-width:0}
.b-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.b-head h2{font-size:2.3rem}
.b-head .clock{font-family:var(--mono);font-size:.9rem;color:var(--muted);margin-inline-start:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.84rem;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.tool.go{border-color:var(--teal);background:var(--teal);color:var(--teal-ink)}
.tool:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.kpi b{display:block;font-weight:800;font-size:1.65rem;line-height:1.15}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi.hot{border-color:var(--alert)}
.kpi.hot b{color:var(--alert)}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1.2;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1;color:var(--ink);padding:4px}
.tile small{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.tile.k-call,.tile.k-bill{background:var(--teal-soft);border-color:var(--teal)}
.tile.k-issue{background:var(--alert);border-color:var(--alert);color:var(--alert-ink)}
.tile.k-issue small{color:var(--alert-ink)}
.tile.s-new::after{content:"";position:absolute;inset:-5px;border-radius:15px;border:2.5px solid var(--yolk);animation:ping 1.8s ease-out infinite}
.tile.sel{outline:3px solid var(--ink);outline-offset:2px}
@keyframes ping{0%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(1.08)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface)}
.legend i.k-call{background:var(--teal-soft);border-color:var(--teal)}
.legend i.k-issue{background:var(--alert);border-color:var(--alert)}
.legend i.s-new{border:2.5px solid var(--yolk)}
.rail{position:relative}
.railbar{height:12px;border-radius:6px;background:linear-gradient(var(--steel-hi),var(--steel-lo));box-shadow:0 3px 6px var(--shadow);position:relative;z-index:1}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px 14px;align-items:start;margin-top:-4px}
.tk{--r:0deg;position:relative;background:var(--paper);color:var(--paper-ink);padding:22px 14px 22px;display:flex;flex-direction:column;gap:7px;transform:rotate(var(--r));transform-origin:50% 0;box-shadow:0 10px 18px var(--shadow);
  -webkit-mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/12px 100% repeat-x;mask:radial-gradient(circle 5px at 50% 100%,transparent 98%,#000) 0 0/12px 100% repeat-x}
.tk:nth-child(3n+1){--r:-.7deg}.tk:nth-child(3n+2){--r:.5deg}.tk:nth-child(3n){--r:-.3deg}
.tk::before{content:"";position:absolute;top:0;inset-inline:calc(50% - 18px);height:9px;border-radius:0 0 4px 4px;background:var(--steel-lo)}
.tk.k-issue{box-shadow:inset -5px 0 0 var(--paper-red),0 10px 18px var(--shadow)}
.tk.in{animation:drop .55s ease-out}
.tk.flash{animation:flash 1.2s ease-out}
@keyframes drop{0%{transform:translateY(-26px) rotate(var(--r));opacity:0}65%{transform:translateY(3px) rotate(calc(var(--r) * -1.4));opacity:1}100%{transform:rotate(var(--r))}}
@keyframes flash{0%{background:var(--paper-yolk)}100%{background:var(--paper)}}
.tk-top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.tk-t{display:flex;align-items:flex-end;gap:6px;line-height:1}
.tk-t small{font-size:.75rem;font-weight:800;color:var(--paper-muted);padding-bottom:6px}
.tk-t b{font-family:var(--display);font-weight:700;font-size:3rem;line-height:.8}
.pill{font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--paper-accent);color:#FFFFFF}
.pill.issue{background:var(--paper-red)}
.pill.new{background:var(--paper-yolk);color:var(--paper-ink)}
.pill.muted{background:var(--paper-line);color:var(--paper-ink)}
.tk-why{font-weight:800}
.tk-note{font-size:.95rem;overflow-wrap:anywhere}
.tk-note small{display:block;font-size:.75rem;color:var(--paper-muted)}
.tk-meta{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;flex-wrap:wrap;font-family:var(--mono);font-size:.76rem;color:var(--paper-muted)}
.age{font-family:var(--mono);font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 8px;background:var(--grid);color:var(--ink);font-weight:600}
.age.warn{background:var(--yolk-soft)}
.age.warn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--st-warn);margin-inline-end:5px;vertical-align:1px}
.age.late{background:var(--alert);color:var(--alert-ink)}
.age.late::after{content:" · מאחר";font-family:var(--body)}

/* ---------- sanitizers (stored data is untrusted) ---------- */
function cleanVenue(d) {
  const v = JSON.parse(JSON.stringify(DEFAULT_VENUE));
  if (!d || typeof d !== 'object') return v;
  if (typeof d.name === 'string' && d.name.trim()) v.name = d.name.trim().slice(0, 40);
  v.tables = int(d.tables, 1, 40) || v.tables;
  if (isHex(d.color)) v.color = d.color;
  v.logo = isLogo(d.logo) ? d.logo : '';
  if (d.wifi && typeof d.wifi === 'object') { v.wifi.ssid = String(d.wifi.ssid || '').slice(0, 40); v.wifi.pass = String(d.wifi.pass || '').slice(0, 64); }
  if (d.links && typeof d.links === 'object') for (const k of ['menu', 'review', 'insta']) v.links[k] = isHttps(d.links[k]) ? d.links[k] : '';
  if (d.buttons && typeof d.buttons === 'object') for (const k of Object.keys(v.buttons)) if (typeof d.buttons[k] === 'boolean') v.buttons[k] = d.buttons[k];

}
function cleanReq(r) {

  if (!table || !KINDS.includes(r.kind) || !createdAt) return null;
  return { id: String(r.id), table, kind: r.kind, reason: REASONS.includes(r.reason) ? r.reason : '', note: typeof r.note === 'string' ? r.note.slice(0, 200) : '',
    lang: LANGS.includes(r.lang) ? r.lang : 'he', src: SRCS.includes(r.src) ? r.src : 'demo', status: STATUSES.includes(r.status) ? r.status : 'new',
    createdAt, ackAt: num(r.ackAt), doneAt: num(r.doneAt), sim: r.sim === true };
}
function cleanScan(s) {
  if (!s || typeof s !== 'object') return null;
  const table = int(s.table, 1, 99), at = num(s.at);
  if (!table || !at) return null;
  return { id: String(s.id), table, at, src: SRCS.includes(s.src) ? s.src : 'demo', lang: LANGS.includes(s.lang) ? s.lang : 'he',
    acts: Array.isArray(s.acts) ? s.acts.filter(a => ACTS.includes(a)).slice(0, 12) : [] };
}
function cleanHistory(h) {
  if (!h || typeof h !== 'object' || !Array.isArray(h.scans) || !Array.isArray(h.reqs)) return null;
  const ok = (row, n) => Array.isArray(row) && row.length === n && row.every(x => typeof x === 'number' && Number.isFinite(x));
  return {
    tables: int(h.tables, 1, 40) || 12,
    scans: h.scans.filter(r => ok(r, 5) && r[0] >= 1 && r[0] <= 31).slice(0, 4000),
    reqs: h.reqs.filter(r => ok(r, 7) && r[0] >= 1 && r[0] <= 31 && r[3] >= 0 && r[3] <= 2).slice(0, 2000)

}

/* ---------- sample week (relative days, so it always reads as "last week") ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genSample(tables, seed) {
  tables = int(tables, 2, 40) || 12;
  const R = mulberry32(seed || 20260924);
  const pick = w => { let s = 0; for (const x of w) s += x; let r = R() * s; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) return i; } return w.length - 1; };
  const HW = [3, 6, 7, 5, 3, 4, 7, 8, 5, 3, 3, 4, 6, 6, 4, 2]; // 07:00..22:00
  const TW = Array.from({ length: tables }, () => 1);
  TW[Math.min(tables, 9) - 1] = 2.2;   // the window table
  TW[Math.min(tables, 4) - 1] = 0.18;  // the table behind the pillar
  const scans = [], reqs = [];
  for (let d = 7; d >= 1; d--) {
    const n = Math.round(tables * 1.25 * (0.8 + R() * 0.5));
    for (let i = 0; i < n; i++) {
      const h = 7 + pick(HW), m = h * 60 + Math.floor(R() * 60), t = pick(TW) + 1, src = R() < 0.64 ? 0 : 1;
      let mask = 0; if (R() < 0.62) mask |= 1; if (R() < 0.24) mask |= 2; if (R() < 0.11) mask |= 4; if (R() < 0.05) mask |= 8;
      scans.push([d, m, t, src, mask]);
      if (R() < 0.17) {
        const kind = pick([50, 34, 16]), reason = kind === 2 ? 1 + pick([25, 40, 20, 10, 5]) : 0;
        const peak = (h >= 12 && h <= 14) || (h >= 19 && h <= 21);
        const resp = Math.round((kind === 1 ? 55 : kind === 2 ? 95 : 65) * (peak ? 1.6 : 1) * (0.55 + R() * 1.1));
        reqs.push([d, Math.min(1439, m + 1 + Math.floor(R() * 20)), t, kind, reason, resp, R() < 0.06 ? 1 : 0]);
      }
    }
  }
  scans.sort((a, b) => b[0] - a[0] || a[1] - b[1]); reqs.sort((a, b) => b[0] - a[0] || a[1] - b[1]);
  return { v: 1, label: 'נתוני דוגמה', tables, scans, reqs };
}

/* ---------- stores ---------- */
function LocalStore() {
  const L = { venue: cleanVenue(DEFAULT_VENUE), reqs: new Map(), scans: new Map(), hist: genSample(12), subs: { venue: new Set(), reqs: new Set(), scans: new Set(), hist: new Set() } };
  const emit = k => setTimeout(() => L.subs[k].forEach(f => f()), 0);
  const nid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const sub = (k, f) => { L.subs[k].add(f); f(); return () => L.subs[k].delete(f); };
  return {
    mode: 'local',
    onVenue: cb => sub('venue', () => cb(L.venue)),
    saveVenue: d => { L.venue = JSON.parse(JSON.stringify(d)); emit('venue'); return Promise.resolve(); },
    onRequests: (since, cb) => sub('reqs', () => cb([...L.reqs].map(([id, d]) => Object.assign({ id }, d)).filter(r => r.createdAt >= since))),
    addRequest: d => { const id = nid(); L.reqs.set(id, Object.assign({}, d)); emit('reqs'); return Promise.resolve(id); },
    updateRequest: (id, p) => { const d = L.reqs.get(id); if (d) { Object.assign(d, p); emit('reqs'); } return Promise.resolve(); },
    onScans: (since, cb) => sub('scans', () => cb([...L.scans].map(([id, d]) => Object.assign({ id }, d)).filter(s => s.at >= since))),
    addScan: d => { const id = nid(); L.scans.set(id, Object.assign({}, d)); emit('scans'); return Promise.resolve(id); },
    updateScan: (id, p) => { const d = L.scans.get(id); if (d) { Object.assign(d, p); emit('scans'); } return Promise.resolve(); },
    onHistory: cb => sub('hist', () => cb(L.hist)),
    setHistory: d => { L.hist = d; emit('hist'); return Promise.resolve(); },
    clearHistory: () => { L.hist = null; emit('hist'); return Promise.resolve(); },
    resetLive: async () => { const n = L.reqs.size + L.scans.size; L.reqs.clear(); L.scans.clear(); emit('reqs'); emit('scans'); return n; }
  };
}
function LiveStore(db) {
  const reqCol = db.collection('requests'), scanCol = db.collection('scans');
  const venueRef = db.doc('venue/main'), histRef = db.doc('history/sample');
  const rows = snap => snap.docs.map(d => Object.assign({ id: d.id }, d.data() || {}));
  return {
    mode: 'live',
    onVenue: (cb, err) => venueRef.onSnapshot(s => cb(s.exists ? s.data() : null), err),
    saveVenue: d => venueRef.set(d),
    onRequests: (since, cb, err) => reqCol.where('createdAt', '>=', since).orderBy('createdAt', 'desc').limit(600).onSnapshot(s => cb(rows(s)), err),
    addRequest: d => { const ref = reqCol.doc(); return ref.set(d).then(() => ref.id); },
    updateRequest: (id, p) => reqCol.doc(id).update(p),
    onScans: (since, cb, err) => scanCol.where('at', '>=', since).orderBy('at', 'desc').limit(1000).onSnapshot(s => cb(rows(s)), err),
    addScan: d => { const ref = scanCol.doc(); return ref.set(d).then(() => ref.id); },
    updateScan: (id, p) => scanCol.doc(id).update(p),
    onHistory: (cb, err) => histRef.onSnapshot(s => cb(s.exists ? s.data() : null), err),
    setHistory: d => histRef.set(d),
    clearHistory: () => histRef.delete(),
    resetLive: async progress => {
      const [a, b] = await Promise.all([reqCol.limit(1000).get(), scanCol.limit(1000).get()]);
      const refs = a.docs.map(d => reqCol.doc(d.id)).concat(b.docs.map(d => scanCol.doc(d.id)));
      const total = refs.length; let done = 0;
      const worker = async () => { while (refs.length) { await refs.pop().delete(); done++; if (progress) progress(done, total); } };
      await Promise.all([worker(), worker(), worker()]);
      return total;
    }
  };
}

const S = {

  view: 'demo', solo: null, hubTable: 7, range: '7', selTable: 0,

};

const canWrite = () => S.mode === 'live' || S.mode === 'local';
let hubDiner = null, soloDiner = null, audio = null, renderQueued = false, toastT = 0;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function queueRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }

function writeFailed(e, quiet) {
  const code = e && e.code;
  if (code === 'invalid_argument' && S.mode === 'live') { S.mode = 'readonly'; queueRender(); toast('אין לכם הרשאה לכתוב בדף הזה. עברנו לצפייה בלבד.'); return; }
  if (code === 'quota_exceeded') { toast('בסיס הנתונים מלא. מחקו את הפניות והסריקות בהגדרות ונסו שוב.'); return; }
  if (code === 'resource_exhausted') { toast('יותר מדי פעולות ברגע אחד. נסו שוב בעוד כמה שניות.'); return; }
  if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled') { S.mode = 'offline'; queueRender(); return; }
  if (!quiet) toast('הפעולה לא נשמרה. בדקו את החיבור ונסו שוב.');
}
async function write(fn, quiet) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); try { return await fn(); } catch (e2) { writeFailed(e2, quiet); throw e2; } }
    writeFailed(e, quiet); throw e;
  }
}

/* ---------- boot ---------- */
function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');
  const m = /^([tq])(\d{1,2})$/.exec(h);
  if (m) { S.solo = { table: int(m[2], 1, 99) || 1, src: m[1] === 't' ? 'nfc' : 'qr' }; return; }
  S.solo = null;
  S.view = ['demo', 'board', 'report', 'setup'].includes(h) ? h : 'demo';
}
function setView(v) {
  S.view = v; S.selTable = 0;
  try { history.replaceState(null, '', '#' + v); } catch (e) { /* frame may refuse; the view still switches */ }
  render(); window.scrollTo(0, 0);
}
async function connect() {
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { db = null; }
  }
  if (!db) { attach(LocalStore(), 'local'); return; }
  let can = null;
  try { can = user ? await user.can('data.write') : null; } catch (e) { can = null; }
  try { S.isEditor = user ? await user.canEdit() : false; } catch (e) { S.isEditor = false; }
  attach(LiveStore(db), can === false ? 'readonly' : 'live');
}
function attach(store, mode) {
  S.store = store; S.mode = mode;
  const since = startOfDay(Date.now(), WINDOW_DAYS);
  const fail = e => { if (e && (e.code === 'revoked' || e.code === 'unavailable')) { S.mode = 'offline'; queueRender(); } };
  store.onVenue(d => { S.venueRaw = d; S.venueLoaded = true; queueRender(); }, fail);
  store.onRequests(since, list => { onRequests(list.map(cleanReq).filter(Boolean)); }, fail);
  if (!S.solo) {
    store.onScans(since, list => { S.scans = list.map(cleanScan).filter(Boolean); queueRender(); }, fail);
    store.onHistory(d => { S.hist = cleanHistory(d); queueRender(); }, fail);
  }
  if (S.solo && canWrite()) soloDiner && soloDiner.ensureScan();
  queueRender();
}
function onRequests(list) {
  const prev = S.seenReqs;
  S.requests = list.sort((a, b) => b.createdAt - a.createdAt);
  S.seenReqs = new Set(list.map(r => r.id));
  if (prev) {
    const fresh = list.filter(r => !prev.has(r.id) && r.status === 'new' && r.createdAt > S.bootAt - 5000);
    if (fresh.length) { S.freshIds = new Set(fresh.map(r => r.id)); if (S.soundOn && !S.solo) beep(fresh.some(r => r.kind === 'issue')); }
  }
  queueRender();
}

function makeDiner(shell, mode, table, src) {
  const nav = (navigator.language || 'he').slice(0, 2).toLowerCase();
  const D = { shell, mode, table, src, lang: mode === 'solo' ? (LANGS.includes(nav) ? nav : (nav === 'iw' ? 'he' : 'en')) : 'he', sig: '', scanId: null, scanTable: 0, acts: [], reason: '', sheet: '', toastT: 0, cool: {} };
  D.mount = force => {
    const v = venue(), sig = JSON.stringify([v, D.lang, D.table, S.isEditor]);
    if (!force && sig === D.sig) { D.refresh(); return; }
    D.sig = sig; D.sheet = '';
    shell.innerHTML = dinerHTML(v, D.lang, D.table, { editorLink: mode === 'solo' && S.isEditor }) + layerHTML(v, D.lang);
    D.refresh();
  };
  D.refresh = () => {
    const box = $('[data-role="status"]', shell); if (!box) return;
    const t = T[D.lang], now = Date.now();

function qrSvg(text, size) {
  if (typeof window.qrcode !== 'function' || !text) return '<div class="note">' + (text ? 'קוד ה-QR לא נטען.' : 'הקישור יופיע אחרי הפרסום.') + '</div>';
  const q = window.qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 4, t = n + 2 * m; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg class="qr" viewBox="0 0 ' + t + ' ' + t + '" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" role="img" aria-label="קוד QR"><rect width="' + t + '" height="' + t + '" fill="#FFFFFF"/><path d="' + d + '" fill="#000000"/></svg>';
}
function readLogo(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)) { rej(new Error('type')); return; }
    if (file.size > 8e6) { rej(new Error('size')); return; }
    const fr = new FileReader();
    fr.onerror = () => rej(fr.error);
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('decode'));
      img.onload = () => {
        const w = img.naturalWidth || 192, h = img.naturalHeight || 192, s = Math.min(1, 192 / Math.max(w, h));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let url = c.toDataURL('image/webp', 0.86);
        if (!/^data:image\/webp/.test(url)) url = c.toDataURL('image/png');
        if (url.length > 200000) url = c.toDataURL('image/jpeg', 0.8);
        res(url);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    if (!int(S.draft.tables, 1, 40)) errs.f_tables = 'מספר בין 1 ל-40.';
    for (const [id, k] of [['f_menu', 'menu'], ['f_review', 'review'], ['f_insta', 'insta']]) if (S.draft.links[k] && !isHttps(S.draft.links[k])) errs[id] = 'הקישור צריך להתחיל ב-https://';
    $$('[data-err]').forEach(x => { x.hidden = !errs[x.dataset.err]; x.textContent = errs[x.dataset.err] || ''; });
    if (Object.keys(errs).length) { $('#f_msg').textContent = 'יש שדות לתקן.'; return; }
    const clean = cleanVenue(Object.assign({}, S.draft, { tables: int(S.draft.tables, 1, 40) }));
    clean.updatedAt = Date.now();
    $('#f_save').disabled = true; $('#f_msg').textContent = 'שומר…';
    try { await write(() => S.store.saveVenue(clean)); S.dirty = false; $('#f_msg').textContent = 'נשמר. כל המכשירים המחוברים מתעדכנים.'; }
    catch (er) { $('#f_msg').textContent = 'השמירה לא הצליחה.'; }
    $('#f_save').disabled = !canWrite();
  });
  main.dataset.setupSig = JSON.stringify([venue(), canWrite()]);
}
async function dataAction(a) {
  if (a === 'askreset') { S.confirmReset = true; render(); return; }
  if (a === 'cancelreset') { S.confirmReset = false; render(); return; }
  if (!canWrite()) return;
  if (a === 'loadsample') { S.busy = 'טוען…'; render(); try { await write(() => S.store.setHistory(genSample(venue().tables, Date.now() % 100000))); toast('נטען שבוע לדוגמה. הוא מופיע בדוח.'); } catch (e) { /* surfaced */ } S.busy = ''; render(); return; }
  if (a === 'clearsample') { S.busy = 'מסיר…'; render(); try { await write(() => S.store.clearHistory()); toast('נתוני הדוגמה הוסרו.'); } catch (e) { /* surfaced */ } S.busy = ''; render(); return; }
  if (a === 'reset') {
    S.confirmReset = false; S.busy = 'מוחק…'; render();
    try { const n = await S.store.resetLive((d, t) => { S.busy = 'נמחקו ' + d + ' מתוך ' + t; const box = $('#datatools'); if (box) box.innerHTML = dataToolsHTML(); }); toast('נמחקו ' + n + ' רשומות.'); }
    catch (e) { writeFailed(e); }
    S.busy = ''; render();
  }
}

/* ---------- render ---------- */
function renderChrome() {
  $$('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.view === S.view ? 'page' : 'false'));
  const c = $('#conn'), map = { connecting: 'מתחבר…', live: 'מחובר · בזמן אמת', local: 'מצב מקומי', readonly: 'צפייה בלבד', offline: 'מנותק' };
  c.className = 'conn ' + S.mode; c.lastChild.textContent = map[S.mode];
  const b = $('#banner'), msg = {
    local: '<b>מצב מקומי.</b><span>הלחיצות נשמרות רק בחלון הזה ולא עוברות בין מכשירים. כדי לעבוד מול בסיס הנתונים המשותף, פתחו את הדף כשאתם מחוברים לחשבון Claude עם הרשאת עריכה.</span>',
    readonly: '<b>צפייה בלבד.</b><span>רואים את הנתונים בזמן אמת, אבל אי אפשר לשלוח או לעדכן. כדי לקבל הרשאה, בקשו מבעלי הדף הזמנה כעורכים.</span>',
    offline: '<b>החיבור לבסיס הנתונים נותק.</b><span>רעננו את הדף כדי להתחבר מחדש.</span>'
  }[S.mode];
  b.hidden = !msg; if (msg) b.innerHTML = msg;
}
function render() {
  if (S.solo) {
    if (!soloDiner) return;
    if (!S.venueLoaded && S.mode === 'connecting') return;
    soloDiner.mount(false);
    return;
  }
  renderChrome();
  const main = $('#main');
  if (main.dataset.view !== S.view) { main.dataset.view = S.view; main.innerHTML = ''; hubDiner = null; delete main.dataset.setupSig; }
  if (S.view === 'demo') {
    if (!$('#hubPhone', main)) {
      main.innerHTML = '<div class="view"><div class="intro"><div><h1>הדגמה <span class="tape">חיה</span>, מול בסיס נתונים אמיתי</h1><p>כל לחיצה בטלפון נשמרת בבסיס הנתונים של הדף, והלוח של הצוות קורא אותה בזמן אמת. פתחו את אותו קישור במכשיר נוסף, וכל לחיצה ועדכון יופיעו בשניהם.</p></div><div id="qrmini"></div></div>' +
        '<div class="hub"><div class="phonecol"><div class="seat"><span>הלקוח יושב בשולחן</span><button type="button" data-seat="-1" aria-label="שולחן קודם">−</button><b id="seatNum"></b><button type="button" data-seat="1" aria-label="שולחן הבא">+</button></div>' +
        '<div class="handset"><div class="screen"><div class="d-shell" id="hubPhone"><div class="d-skel">טוען את דף השולחן…</div></div></div></div><p class="caption">זה הדף שנפתח ללקוח כשהוא מצמיד את הטלפון לסטנד. נסו כפתור, ואז "בדרך" בלוח.</p></div>' +
        '<div id="hubBoard"></div></div></div>';
    }
    const v = venue(); S.hubTable = Math.min(S.hubTable, v.tables);
    $('#seatNum').textContent = S.hubTable;
    const qm = $('#qrmini');
    if (qm && !qm.dataset.done && ARTIFACT_URL && typeof window.qrcode === 'function') { qm.dataset.done = '1'; qm.innerHTML = '<div class="qrmini">' + qrSvg(linkFor(7, 'qr'), 92) + '<span>סרקו מהטלפון כדי לשבת בשולחן 7. הלחיצות שלכם יופיעו בלוח כאן.</span></div>'; }
    if (S.venueLoaded) {
      if (!hubDiner) hubDiner = makeDiner($('#hubPhone'), 'hub', S.hubTable, 'demo');
      hubDiner.table = S.hubTable; hubDiner.mount(false);
    }
    $('#hubBoard').innerHTML = boardHTML(true);
  } else if (S.view === 'board') {
    main.innerHTML = '<div class="view">' + boardHTML(false) + '</div>';
  } else if (S.view === 'report') {
    renderReport(main);
  } else if (S.view === 'setup') {
    const sig = JSON.stringify([venue(), canWrite()]);
    if (!$('#venueForm', main) || (!S.dirty && main.dataset.setupSig !== sig)) mountSetup(main);
    else { $('#labels').innerHTML = labelsHTML(); $('#datatools').innerHTML = dataToolsHTML(); }
  }
  S.freshIds = null;
}
function tick() {
  const now = Date.now();
  $$('[data-since]').forEach(e => {
    const ms = now - (+e.dataset.since); e.textContent = mmss(ms);
    if (e.hasAttribute('data-sla')) { e.classList.toggle('warn', ms >= 120000 && ms < 300000); e.classList.toggle('late', ms >= 300000); }
  });
  const c = $('#clock'); if (c) c.textContent = hhmm(now);
  [hubDiner, soloDiner].forEach(D => { if (D && D.hasDone) D.refresh(); });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab[data-view]'); if (tab) { setView(tab.dataset.view); return; }
  const go = e.target.closest('[data-goto]'); if (go) { setView(go.dataset.goto); return; }
  if (S.solo) return;
  const act = e.target.closest('[data-do]');
  if (act) { const tk = act.closest('.tk'); if (tk) setStatus(tk.dataset.id, act.dataset.do); return; }
  const tl = e.target.closest('[data-tool]'); if (tl) { tool(tl.dataset.tool); return; }
  const seat = e.target.closest('[data-seat]');
  if (seat) { const n = venue().tables; S.hubTable = ((S.hubTable - 1 + (+seat.dataset.seat) + n) % n) + 1; render(); return; }
  const tile = e.target.closest('.tile[data-table]');
  if (tile) {
    const n = +tile.dataset.table;
    if (S.view === 'demo') { S.hubTable = n; render(); }
    else { S.selTable = S.selTable === n ? 0 : n; render(); const first = $('.tk[data-t="' + n + '"]'); if (first) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    return;
  }
  const rg = e.target.closest('[data-range]'); if (rg) { S.range = rg.dataset.range; render(); return; }
  const tv = e.target.closest('[data-tview]');
  if (tv) { const card = tv.closest('.card'), twin = $('[data-twin="' + tv.dataset.tview + '"]', card), viz = $('.viz', card); const toTable = twin.hidden; twin.hidden = !toTable; viz.hidden = toTable; tv.textContent = toTable ? 'תרשים' : 'טבלה'; return; }
  const da = e.target.closest('[data-data]'); if (da) { dataAction(da.dataset.data); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { copyText(cp.dataset.copy, () => toast('הקישור הועתק. אפשר לכתוב אותו לצ׳יפ באפליקציית NFC.'), () => toast(cp.dataset.copy)); }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('handled')) S.openHandled = e.target.open; }, true);
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.view === 'report' && !S.solo) render(); }, 200); });
window.addEventListener('hashchange', () => { const was = !!S.solo; parseHash(); if (was !== !!S.solo) { location.reload(); return; } render(); });
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && S.wakeWanted && !S.wake) { try { S.wake = await navigator.wakeLock.request('screen'); } catch (e) { /* optional */ } } });

/* ---------- start ---------- */
parseHash();
if (S.solo) {
  $('#app').hidden = true;
  const solo = $('#solo'); solo.hidden = false;
  solo.innerHTML = '<div class="d-shell standalone" id="soloShell"><div class="d-skel">טוען…</div></div>';
  soloDiner = makeDiner($('#soloShell'), 'solo', S.solo.table, S.solo.src);
} else {
  render();
}
connect();
setInterval(tick, 1000);
})();
</script>
